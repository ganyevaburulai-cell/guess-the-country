<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай страну · Командная игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0B3B5C 0%, #1B5A7A 50%, #6FB3D9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 10% 30%, rgba(255,255,255,0.15) 0%, transparent 30%),
                        radial-gradient(circle at 90% 70%, rgba(255,255,255,0.1) 0%, transparent 40%);
            pointer-events: none;
        }

        .game-card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 70px 70px 50px 50px;
            padding: 28px 28px 36px;
            box-shadow: 0 30px 50px rgba(0, 30, 50, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.5) inset, 0 0 20px rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 2;
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, #E1F3FE, #B0E0FF, #E1F3FE);
            border-radius: 60px;
            padding: 8px 24px 8px 32px;
            margin-bottom: 22px;
            border: 1px solid white;
            box-shadow: 0 6px 0 #5899C0, 0 10px 20px rgba(0,60,100,0.3);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #02457A, #0C6B9E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.7);
            letter-spacing: 1px;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            background: #02457A;
            padding: 5px;
            border-radius: 40px;
            border: 2px solid #B1E6FF;
        }

        .mode-btn {
            background: transparent;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-btn.active {
            background: #FFE68F;
            color: #02457A;
            box-shadow: 0 2px 0 #B8860B;
        }

        .timer-container {
            background: #02457A;
            border-radius: 30px;
            padding: 6px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid #B1E6FF;
            box-shadow: 0 4px 0 #00273F;
        }

        .timer-icon {
            font-size: 1.5rem;
            color: #FFE68F;
        }

        .timer-display {
            font-size: 2rem;
            font-weight: 700;
            color: #FFE68F;
            font-family: 'Courier New', monospace;
            min-width: 70px;
            text-align: center;
        }

        /* Командная панель */
        .teams-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .team-card {
            flex: 1;
            min-width: 180px;
            background: white;
            border-radius: 30px;
            padding: 15px;
            text-align: center;
            border: 3px solid;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.2s;
        }

        .team-card.active-team {
            transform: scale(1.02);
            filter: brightness(1.1);
            box-shadow: 0 0 20px gold;
        }

        .team-card.team1 {
            border-color: #FF6B6B;
            background: linear-gradient(145deg, #FFE6E6, #FFD1D1);
        }

        .team-card.team2 {
            border-color: #4ECDC4;
            background: linear-gradient(145deg, #E0F7F5, #C0EFEA);
        }

        .team-card.team3 {
            border-color: #FFD93D;
            background: linear-gradient(145deg, #FFF4D6, #FFEBB3);
        }

        .team-card.team4 {
            border-color: #A78BFA;
            background: linear-gradient(145deg, #F0E8FF, #E2D4FF);
        }

        .team-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .team-score {
            font-size: 2rem;
            font-weight: 800;
            font-family: 'Courier New', monospace;
        }

        .team-turn {
            font-size: 1rem;
            margin-top: 5px;
            padding: 3px 10px;
            background: rgba(0,0,0,0.1);
            border-radius: 20px;
            display: inline-block;
        }

        .current-turn {
            background: #02457A;
            color: white;
            padding: 10px 25px;
            border-radius: 40px;
            font-size: 1.3rem;
            font-weight: 600;
            margin: 10px 0;
            display: inline-block;
            border: 2px solid #FFE68F;
        }

        .map-globe {
            background: linear-gradient(145deg, #B3E0FF, #7FC9FF);
            border-radius: 50px;
            padding: 18px;
            border: 2px solid white;
            box-shadow: 0 0 0 3px #0284C7, 0 20px 30px -8px #003459;
            margin-bottom: 20px;
        }

        .canvas-wrapper {
            display: flex;
            justify-content: center;
            background: #A4D4F4;
            border-radius: 40px;
            padding: 12px;
            border: 1px solid #DFF6FF;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 580px;
            height: auto;
            background: #C5E6FF;
            border-radius: 35px;
            box-shadow: 0 0 0 4px white, 0 18px 25px -8px #002B49;
            cursor: pointer;
            transition: transform 0.2s;
        }

        canvas:hover {
            transform: scale(1.01);
            box-shadow: 0 0 0 4px #FFFAE0, 0 20px 30px -6px #001F33;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #DBF0FF;
            border-radius: 60px;
            padding: 10px 16px 10px 30px;
            margin: 15px 0 20px;
            border: 1px solid white;
            box-shadow: 0 5px 0 #6CABD0, 0 8px 15px rgba(0,60,110,0.3);
        }

        .round-earth {
            background: white;
            border-radius: 50px;
            padding: 8px 28px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #01538B;
            border: 2px solid #74C0F0;
            box-shadow: inset 0 1px 5px #C1E4FF;
        }

        .hint-earth {
            background: #E7F5FF;
            border-radius: 50px;
            padding: 16px 28px;
            margin: 5px 0 20px;
            border: 2px solid white;
            box-shadow: inset 0 2px 8px #AFD8FF, 0 6px 0 #4C90B8;
            font-size: 1.3rem;
            color: #014682;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .word-panel {
            background: #B9DEFF;
            border-radius: 60px;
            padding: 22px 20px;
            margin: 15px 0 20px;
            border: 2px solid white;
            box-shadow: inset 0 0 0 3px #E8F6FF, 0 10px 0 #2A739E;
        }

        .word-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 18px;
        }

        .letter-block {
            width: 3.4rem;
            height: 3.4rem;
            background: linear-gradient(145deg, #F0F9FF, #D4ECFF);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            color: #014177;
            box-shadow: inset 0 -4px 0 #9FC9FF, 0 7px 0 #256799;
            border: 1px solid white;
            text-transform: uppercase;
        }

        .letter-block.blank {
            background: #A4CDF2;
            color: transparent;
            box-shadow: inset 0 -4px 0 #6FA3D9, 0 7px 0 #1D5A86;
        }

        .keyboard-earth {
            background: #7CB9E8;
            border-radius: 50px 50px 30px 30px;
            padding: 20px 15px;
            margin: 15px 0 25px;
            border: 2px solid white;
            box-shadow: inset 0 0 0 3px #CAE9FF, 0 12px 0 #146094;
        }

        .keys-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .key-earth {
            width: 2.7rem;
            height: 2.7rem;
            background: linear-gradient(145deg, #EFF9FF, #C7E4FF);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #002C55;
            box-shadow: inset 0 -3px 0 #79B9EE, 0 5px 0 #1D5A8B;
            border: 1px solid white;
            cursor: pointer;
            transition: 0.04s;
            text-transform: lowercase;
        }

        .key-earth:active {
            transform: translateY(4px);
            box-shadow: inset 0 -1px 0 #79B9EE, 0 1px 0 #1D5A8B;
        }

        .key-earth.used {
            background: #9BBFDF;
            color: #E0F0FF;
            border-color: #A3C9F0;
            box-shadow: inset 0 0 10px #7AADD9;
            transform: translateY(3px);
            pointer-events: none;
            opacity: 0.7;
        }

        .key-earth.disabled {
            pointer-events: none;
            opacity: 0.5;
            filter: grayscale(0.5);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 25px 0 10px;
        }

        .btn-earth {
            background: linear-gradient(145deg, #E6F4FF, #B0D9FF);
            border: none;
            border-radius: 60px;
            padding: 14px 40px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #014682;
            box-shadow: 0 8px 0 #1E6A9E, 0 12px 25px -8px #002A47;
            cursor: pointer;
            border: 2px solid white;
            transition: 0.06s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-earth:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #1E6A9E, 0 8px 15px -6px #002A47;
        }

        .btn-earth:disabled {
            opacity: 0.5;
            pointer-events: none;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #1E6A9E;
        }

        .btn-next {
            background: linear-gradient(145deg, #D4EEFF, #9AC9FF);
            box-shadow: 0 8px 0 #0F6498, 0 12px 25px -8px #002A47;
        }

        .footer-earth {
            text-align: center;
            color: #E0F0FF;
            text-shadow: 0 2px 4px #003C66;
            font-size: 1.1rem;
            margin-top: 20px;
            font-weight: 500;
        }

        .game-over-message {
            background: #B22222;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        .team-win {
            background: gold;
            color: #02457A;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="game-header">
            <h1>🌍 КОМАНДНАЯ ИГРА</h1>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="solo">👤 1 игрок</button>
                <button class="mode-btn" data-mode="teams2">👥 2 команды</button>
                <button class="mode-btn" data-mode="teams3">👥 3 команды</button>
                <button class="mode-btn" data-mode="teams4">👥 4 команды</button>
            </div>
            <div class="timer-container">
                <span class="timer-icon">⏳</span>
                <span class="timer-display" id="timerDisplay">60</span>
            </div>
        </div>

        <!-- Командная панель (будет заполняться динамически) -->
        <div id="teamsPanel" class="teams-panel"></div>
        
        <!-- Индикатор текущего хода -->
        <div id="turnIndicator" class="current-turn">👤 Ваш ход</div>

        <div class="map-globe">
            <div class="canvas-wrapper">
                <canvas id="countryCanvas" width="550" height="270"></canvas>
            </div>
        </div>

        <div class="info-panel">
            <span class="round-earth" id="roundDisplay">1 / ∞</span>
        </div>

        <div class="hint-earth" id="hintDisplay">
            👆 нажми на карту для подсказки
        </div>

        <!-- Слово (маска) -->
        <div class="word-panel">
            <div id="wordContainer" class="word-row"></div>
        </div>

        <!-- Клавиатура -->
        <div class="keyboard-earth">
            <div id="keyboardContainer" class="keys-container"></div>
        </div>

        <div class="actions">
            <button id="nextCountryBtn" class="btn-earth btn-next">⏩ пропустить</button>
            <button id="hintBtn" class="btn-earth">💡 подсказка</button>
            <button id="resetGameBtn" class="btn-earth">🔄 новая игра</button>
            <button id="endTurnBtn" class="btn-earth" style="background: linear-gradient(145deg, #FFD1D1, #FFB6B6);">🤝 передать ход</button>
        </div>
        <div class="footer-earth">
            ✦ играйте командами · отвечайте по очереди ✦
        </div>
    </div>

    <script>
        (function() {
            const countries = [
                { code: 'FR', name: 'франция', hint: 'Европа · форма шестиугольника' },
                { code: 'IT', name: 'италия', hint: 'сапог · Средиземноморье' },
                { code: 'ES', name: 'испания', hint: 'Пиренейский полуостров' },
                { code: 'DE', name: 'германия', hint: 'Центральная Европа' },
                { code: 'GB', name: 'великобритания', hint: 'остров · Лондон' },
                { code: 'RU', name: 'россия', hint: 'самая большая · Евразия' },
                { code: 'US', name: 'сша', hint: 'Северная Америка' },
                { code: 'CA', name: 'канада', hint: 'кленовый лист · север' },
                { code: 'MX', name: 'мексика', hint: 'между США и Гватемалой' },
                { code: 'BR', name: 'бразилия', hint: 'Южная Америка · большая' },
                { code: 'AR', name: 'аргентина', hint: 'юг Америки · длинная' },
                { code: 'AU', name: 'австралия', hint: 'Океания · материк' },
                { code: 'IN', name: 'индия', hint: 'Азия · полуостров' },
                { code: 'CN', name: 'китай', hint: 'восточная Азия · дракон' },
                { code: 'JP', name: 'япония', hint: 'острова · архипелаг' },
                { code: 'EG', name: 'египет', hint: 'Африка · пирамиды' },
                { code: 'ZA', name: 'юар', hint: 'юг Африки' },
                { code: 'NO', name: 'норвегия', hint: 'фьорды · скандинавия' },
                { code: 'GR', name: 'греция', hint: 'Балканы · острова' },
                { code: 'TH', name: 'таиланд', hint: 'Индокитай · слоны' }
            ];

            const alphabet = 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя'.split('');

            // DOM элементы
            const canvas = document.getElementById('countryCanvas');
            const ctx = canvas.getContext('2d');
            const hintSpan = document.getElementById('hintDisplay');
            const roundSpan = document.getElementById('roundDisplay');
            const timerSpan = document.getElementById('timerDisplay');
            const wordDiv = document.getElementById('wordContainer');
            const keyboardDiv = document.getElementById('keyboardContainer');
            const teamsPanel = document.getElementById('teamsPanel');
            const turnIndicator = document.getElementById('turnIndicator');
            const nextBtn = document.getElementById('nextCountryBtn');
            const hintBtn = document.getElementById('hintBtn');
            const resetBtn = document.getElementById('resetGameBtn');
            const endTurnBtn = document.getElementById('endTurnBtn');
            const modeBtns = document.querySelectorAll('.mode-btn');

            // Состояние игры
            let currentCountry = null;
            let normalizedName = '';
            let guessedLetters = new Set();
            let gameWonForCurrent = false;
            let roundCount = 0;
            
            // Командный режим
            let gameMode = 'solo'; // solo, teams2, teams3, teams4
            let teams = [
                { id: 1, name: 'Красные', score: 0, color: '#FF6B6B', active: true },
                { id: 2, name: 'Синие', score: 0, color: '#4ECDC4', active: false },
                { id: 3, name: 'Жёлтые', score: 0, color: '#FFD93D', active: false },
                { id: 4, name: 'Фиолетовые', score: 0, color: '#A78BFA', active: false }
            ];
            let activeTeamIndex = 0; // Индекс активной команды (0 для solo)
            let totalTeams = 1;

            // Таймер
            let timeLeft = 60;
            let timerInterval = null;
            let gameActive = true;

            // Функции таймера
            function startTimer() {
                if (timerInterval) clearInterval(timerInterval);
                
                timerInterval = setInterval(() => {
                    if (!gameActive) return;
                    
                    timeLeft--;
                    timerSpan.textContent = timeLeft;
                    
                    if (timeLeft <= 10) {
                        timerSpan.style.color = '#FF4500';
                        timerSpan.style.textShadow = '0 0 5px red';
                    } else if (timeLeft <= 20) {
                        timerSpan.style.color = '#FFA500';
                    } else {
                        timerSpan.style.color = '#FFE68F';
                    }
                    
                    if (timeLeft <= 0) {
                        gameOver();
                    }
                }, 1000);
            }

            function gameOver() {
                gameActive = false;
                clearInterval(timerInterval);
                
                document.querySelectorAll('.key-earth').forEach(key => {
                    key.classList.add('disabled');
                });
                
                nextBtn.disabled = true;
                hintBtn.disabled = true;
                endTurnBtn.disabled = true;
                
                // Определяем победителя
                if (gameMode !== 'solo') {
                    const maxScore = Math.max(...teams.map(t => t.score));
                    const winners = teams.filter(t => t.score === maxScore);
                    if (winners.length === 1) {
                        hintSpan.innerHTML = `🏆 ПОБЕДИЛА КОМАНДА ${winners[0].name}! Счёт: ${winners[0].score} 🏆`;
                    } else {
                        hintSpan.innerHTML = `🤝 НИЧЬЯ! Несколько команд набрали ${maxScore} очков`;
                    }
                } else {
                    hintSpan.innerHTML = `⏰ ВРЕМЯ ВЫШЛО! Ваш счёт: ${teams[0].score} очков`;
                }
                
                hintSpan.style.backgroundColor = '#B22222';
                hintSpan.style.color = 'white';
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#8ECCED';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.font = 'bold 40px "Segoe UI"';
                ctx.fillStyle = '#B22222';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 10;
                ctx.fillText('GAME OVER', 120, 140);
                ctx.shadowBlur = 0;
                
                ctx.font = 'bold 20px "Segoe UI"';
                ctx.fillStyle = '#02457A';
                ctx.fillText(`Счёт: ${teams[activeTeamIndex].score}`, 220, 200);
            }

            // Обновление отображения команд
            function renderTeams() {
                let html = '';
                for (let i = 0; i < totalTeams; i++) {
                    const team = teams[i];
                    html += `
                        <div class="team-card team${i+1} ${i === activeTeamIndex && gameMode !== 'solo' ? 'active-team' : ''}" 
                             data-team="${i}" 
                             style="cursor: ${gameMode === 'solo' ? 'default' : 'pointer'}">
                            <div class="team-name">${team.name}</div>
                            <div class="team-score" id="team-score-${i}">${team.score}</div>
                            ${i === activeTeamIndex && gameMode !== 'solo' ? '<div class="team-turn">🔴 СЕЙЧАС ХОДЯТ</div>' : ''}
                        </div>
                    `;
                }
                teamsPanel.innerHTML = html;
                
                // Добавляем возможность переключать команду кликом (для учителя)
                if (gameMode !== 'solo') {
                    document.querySelectorAll('.team-card').forEach(card => {
                        card.addEventListener('click', (e) => {
                            const teamIndex = parseInt(card.dataset.team);
                            if (!isNaN(teamIndex) && teamIndex !== activeTeamIndex) {
                                switchTeam(teamIndex);
                            }
                        });
                    });
                }
                
                // Обновляем индикатор хода
                if (gameMode === 'solo') {
                    turnIndicator.textContent = '👤 Играете один';
                } else {
                    turnIndicator.textContent = `🎯 Ход команды: ${teams[activeTeamIndex].name}`;
                }
            }

            // Переключение команды
            function switchTeam(newIndex) {
                if (!gameActive || gameMode === 'solo') return;
                if (newIndex >= 0 && newIndex < totalTeams) {
                    activeTeamIndex = newIndex;
                    renderTeams();
                }
            }

            // Добавление очка активной команде
            function addPointToActiveTeam() {
                if (!gameActive) return;
                
                if (gameMode === 'solo') {
                    teams[0].score++;
                    document.getElementById('team-score-0').textContent = teams[0].score;
                } else {
                    teams[activeTeamIndex].score++;
                    document.getElementById(`team-score-${activeTeamIndex}`).textContent = teams[activeTeamIndex].score;
                }
            }

            // Смена режима игры
            function setGameMode(mode) {
                gameMode = mode;
                
                // Обновляем активные команды
                if (mode === 'solo') {
                    totalTeams = 1;
                    activeTeamIndex = 0;
                    teams[0].name = 'Игрок';
                    endTurnBtn.style.display = 'none';
                } else if (mode === 'teams2') {
                    totalTeams = 2;
                    activeTeamIndex = 0;
                    teams[0].name = 'Красные';
                    teams[1].name = 'Синие';
                    endTurnBtn.style.display = 'inline-flex';
                } else if (mode === 'teams3') {
                    totalTeams = 3;
                    activeTeamIndex = 0;
                    teams[0].name = 'Красные';
                    teams[1].name = 'Синие';
                    teams[2].name = 'Жёлтые';
                    endTurnBtn.style.display = 'inline-flex';
                } else if (mode === 'teams4') {
                    totalTeams = 4;
                    activeTeamIndex = 0;
                    teams[0].name = 'Красные';
                    teams[1].name = 'Синие';
                    teams[2].name = 'Жёлтые';
                    teams[3].name = 'Фиолетовые';
                    endTurnBtn.style.display = 'inline-flex';
                }
                
                // Сбрасываем счёт
                for (let i = 0; i < teams.length; i++) {
                    teams[i].score = 0;
                }
                
                renderTeams();
            }

            // Загрузка карты
            async function loadMapImage(countryCode) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.src = `https://raw.githubusercontent.com/djaiss/mapsicon/33ce47b/mapsicon/all/${countryCode.toLowerCase()}/vector.svg`;
                    
                    const timeout = setTimeout(() => {
                        drawFallbackMap(countryCode);
                        resolve();
                    }, 2500);

                    img.onload = () => {
                        clearTimeout(timeout);
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#8ECCED';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        const scale = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.85;
                        const w = img.width * scale;
                        const h = img.height * scale;
                        const x = (canvas.width - w) / 2;
                        const y = (canvas.height - h) / 2;
                        
                        ctx.shadowColor = '#003A5D';
                        ctx.shadowBlur = 12;
                        ctx.shadowOffsetY = 4;
                        ctx.drawImage(img, x, y, w, h);
                        
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = '#002B4A';
                        ctx.lineWidth = 2.5;
                        ctx.strokeRect(x-1, y-1, w+2, h+2);
                        
                        ctx.strokeStyle = '#FFFFFF';
                        ctx.lineWidth = 1.2;
                        ctx.strokeRect(x, y, w, h);
                        
                        ctx.font = 'bold 16px "Segoe UI"';
                        ctx.fillStyle = '#01538B';
                        ctx.shadowColor = 'white';
                        ctx.shadowBlur = 6;
                        ctx.fillText('✦', 35, 45);
                        ctx.shadowBlur = 0;
                        resolve();
                    };
                    
                    img.onerror = () => {
                        clearTimeout(timeout);
                        drawFallbackMap(countryCode);
                        resolve();
                    };
                });
            }

            function drawFallbackMap(code) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#89C7E7';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const hash = code.charCodeAt(0) + (code.charCodeAt(1) || 0) * 10;
                ctx.fillStyle = '#B7D9A0';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 3;
                
                ctx.beginPath();
                const pts = 8;
                for (let i = 0; i <= pts; i++) {
                    const angle = (i / pts) * Math.PI * 2 + (hash % 20) * 0.1;
                    const radX = 130 + (hash % 50);
                    const radY = 90 + ((hash >> 3) % 40);
                    const xOff = 280 + Math.cos(angle) * radX;
                    const yOff = 130 + Math.sin(angle) * radY;
                    if (i === 0) ctx.moveTo(xOff, yOff);
                    else ctx.lineTo(xOff, yOff);
                }
                ctx.closePath();
                ctx.fillStyle = '#9FC9A5';
                ctx.fill();
                ctx.strokeStyle = '#023B66';
                ctx.lineWidth = 4;
                ctx.stroke();
                
                ctx.strokeStyle = '#F0F9FF';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.shadowBlur = 0;
                ctx.font = 'bold 28px "Segoe UI"';
                ctx.fillStyle = '#014682';
                ctx.shadowColor = 'white';
                ctx.shadowBlur = 10;
                ctx.fillText(code, 340, 70);
                ctx.shadowBlur = 0;
            }

            function refreshDisplay() {
                if (!currentCountry) return;

                const nameChars = normalizedName.split('');
                let wordHtml = '';
                for (let ch of nameChars) {
                    if (ch === ' ') {
                        wordHtml += `<div class="letter-block blank" style="background:transparent; border:1px dashed #3C9BD7; box-shadow:none;"> </div>`;
                    } else {
                        const guessed = guessedLetters.has(ch);
                        wordHtml += `<div class="letter-block ${guessed ? '' : 'blank'}">${guessed ? ch : '?'}</div>`;
                    }
                }
                wordDiv.innerHTML = wordHtml;

                const allGuessed = nameChars.every(ch => ch === ' ' || guessedLetters.has(ch));
                if (allGuessed && !gameWonForCurrent && gameActive) {
                    gameWonForCurrent = true;
                    addPointToActiveTeam();
                    hintSpan.innerText = '🌍 Страна угадана! +1 очко команде';
                } else if (allGuessed) {
                    hintSpan.innerText = '✅ уже открыто';
                }

                let keysHtml = '';
                for (let letter of alphabet) {
                    const used = guessedLetters.has(letter);
                    keysHtml += `<div class="key-earth ${used ? 'used' : ''} ${!gameActive ? 'disabled' : ''}" data-letter="${letter}">${letter}</div>`;
                }
                keyboardDiv.innerHTML = keysHtml;
                
                document.querySelectorAll('.key-earth[data-letter]').forEach(k => {
                    k.addEventListener('click', (e) => {
                        const l = e.currentTarget.dataset.letter;
                        if (gameActive && !gameWonForCurrent && !guessedLetters.has(l)) handleLetter(l);
                    });
                });
            }

            function handleLetter(letter) {
                if (!currentCountry || gameWonForCurrent || !gameActive) return;
                letter = letter.toLowerCase();
                if (guessedLetters.has(letter)) return;

                if (normalizedName.includes(letter)) {
                    guessedLetters.add(letter);
                    hintSpan.innerText = `✅ буква «${letter}» есть`;
                } else {
                    guessedLetters.add(letter);
                    hintSpan.innerText = `❌ нет буквы «${letter}»`;
                }
                refreshDisplay();
            }

            async function nextCountry() {
                if (!gameActive) return;
                
                let newIndex;
                if (countries.length === 1) newIndex = 0;
                else {
                    do {
                        newIndex = Math.floor(Math.random() * countries.length);
                    } while (currentCountry && countries[newIndex].code === currentCountry.code && countries.length > 1);
                }
                
                currentCountry = { ...countries[newIndex] };
                normalizedName = currentCountry.name.toLowerCase().replace(/\s+/g, '');
                guessedLetters.clear();
                gameWonForCurrent = false;
                
                roundCount++;
                roundSpan.innerText = `${roundCount} / ∞`;

                hintSpan.innerText = 'загрузка карты...';
                await loadMapImage(currentCountry.code);
                hintSpan.innerText = `🌍 ${currentCountry.hint}`;
                refreshDisplay();
            }

            function hintLetter() {
                if (!currentCountry || gameWonForCurrent || !gameActive) return;
                const missing = normalizedName.split('').filter(ch => ch !== ' ' && !guessedLetters.has(ch));
                if (missing.length === 0) {
                    hintSpan.innerText = '✨ все буквы открыты';
                    return;
                }
                const randLetter = missing[Math.floor(Math.random() * missing.length)];
                guessedLetters.add(randLetter);
                
                const allGuessed = normalizedName.split('').every(ch => ch === ' ' || guessedLetters.has(ch));
                if (allGuessed && !gameWonForCurrent) {
                    gameWonForCurrent = true;
                    addPointToActiveTeam();
                }
                
                hintSpan.innerText = `💡 открыта буква «${randLetter}»`;
                refreshDisplay();
            }

            function resetGame() {
                gameActive = true;
                timeLeft = 100;
                timerSpan.textContent = timeLeft;
                timerSpan.style.color = '#FFE68F';
                timerSpan.style.textShadow = 'none';
                
                roundCount = 0;
                
                for (let i = 0; i < teams.length; i++) {
                    teams[i].score = 0;
                }
                
                nextBtn.disabled = false;
                hintBtn.disabled = false;
                endTurnBtn.disabled = false;
                
                hintSpan.style.backgroundColor = '';
                hintSpan.style.color = '#014682';
                
                document.querySelectorAll('.key-earth').forEach(key => {
                    key.classList.remove('disabled');
                });
                
                if (timerInterval) clearInterval(timerInterval);
                startTimer();
                
                renderTeams();
                nextCountry();
            }

            function endTurn() {
                if (!gameActive || gameMode === 'solo') return;
                
                // Переключаем на следующую команду
                activeTeamIndex = (activeTeamIndex + 1) % totalTeams;
                renderTeams();
                
                // Автоматически переходим к новой стране
                nextCountry();
                
                hintSpan.innerText = `🤝 Ход передан команде ${teams[activeTeamIndex].name}`;
            }

            canvas.addEventListener('click', () => {
                if (!currentCountry) return;
                if (!gameActive) {
                    hintSpan.innerHTML = '⏰ ВРЕМЯ ВЫШЛО! Нажми "новая игра" чтобы начать заново';
                    return;
                }
                if (gameWonForCurrent) hintSpan.innerText = '✨ страна уже угадана · жми "следующая"';
                else hintSpan.innerText = `🌎 ${currentCountry.hint}`;
            });

            // Обработчики кнопок
            nextBtn.addEventListener('click', () => { nextCountry(); });
            hintBtn.addEventListener('click', hintLetter);
            resetBtn.addEventListener('click', resetGame);
            endTurnBtn.addEventListener('click', endTurn);

            // Обработчики режимов
            modeBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    modeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    setGameMode(btn.dataset.mode);
                    resetGame();
                });
            });

            // Старт
            (async function init() {
                setGameMode('solo');
                await nextCountry();
                startTimer();
                renderTeams();
            })();
        })();
    </script>
</body>
</html>
